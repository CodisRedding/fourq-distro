<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fourq Distro</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Fourq Distro</h1>
    <div id="stats" class="stats"></div>
  </header>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Search artist, title, label…">
    <select id="tierFilter">
      <option value="">All tiers</option>
      <option value="Tier 1 - Individual (high value)">Tier 1 — high value</option>
      <option value="Tier 1 - Individual (no comp, needs research)">Tier 1 — no comp</option>
      <option value="Tier 2 - Lot">Tier 2 — artist lots</option>
      <option value="Tier 3 - Bulk grab bag">Tier 3 — bulk</option>
    </select>
    <select id="ebayFilter">
      <option value="">eBay: any status</option>
      <option value="unlisted">Unlisted</option>
      <option value="listed">Listed</option>
      <option value="sold">Sold</option>
    </select>
    <select id="fbFilter">
      <option value="">FB: any status</option>
      <option value="unlisted">Unlisted</option>
      <option value="listed">Listed</option>
      <option value="sold">Sold</option>
    </select>
    <select id="discogsFilter">
      <option value="">Discogs: any status</option>
      <option value="unlisted">Unlisted</option>
      <option value="listed">Listed</option>
      <option value="sold">Sold</option>
    </select>
    <select id="instagramFilter">
      <option value="">Instagram: any status</option>
      <option value="unlisted">Unlisted</option>
      <option value="listed">Listed</option>
      <option value="sold">Sold</option>
    </select>
    <label class="hide-sold"><input id="hideSold" type="checkbox" checked> Hide sold</label>
    <label class="hide-sold" title="Uses the local Ollama vision model to flag which uploaded photo shows the dead wax/runout ring, so it's marked in the photo grid for you to read yourself. Does not attempt to read the text itself.">
      <input id="autoTagDeadwax" type="checkbox"> Auto-tag runout photos
    </label>
    <label class="hide-sold" title="Uses the local Ollama vision model to read artist/title/label/format/year/country off a new arrival's cover and label photos and fill in Step 2 — only while those fields are still blank, and never overwrites anything you've typed. Does not run the Discogs lookup for you; that's still a manual click once you've checked the fields.">
      <input id="autoIdentify" type="checkbox"> Auto-identify from photos
    </label>
    <label class="hide-sold" title="Prepends a short disclosure to every Instagram caption noting that posting is still a test on your personal account, while making clear the record itself is genuinely for sale. Turn this off once you move to a dedicated storefront account.">
      <input id="instagramBetaNotice" type="checkbox"> Instagram beta-test notice
    </label>
    <button id="syncInstagramStatsBtn" title="Refreshes like/comment counts for every record with a live Instagram post. Never runs automatically — click when you want fresh numbers.">Sync Instagram stats</button>
    <button id="addRecordBtn" class="primary">+ Add record</button>
  </div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>Artist</th>
          <th>Title</th>
          <th>Format</th>
          <th>Year</th>
          <th>Tier</th>
          <th>Asking</th>
          <th>eBay</th>
          <th>FB</th>
          <th>Discogs</th>
          <th>IG</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="overlay" class="overlay hidden">
    <div id="panel" class="panel"></div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <img id="lightboxImg" src="" draggable="false">
  </div>

  <script src="fees.js"></script>
  <script src="app.js"></script>
</body>
</html>
